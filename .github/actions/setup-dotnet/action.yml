name: Set up .NET
description: Install the repository SDK and restore the OS-scoped NuGet cache.
inputs:
  cache-write:
    description: Allow this job to save shared dependency caches
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - uses: actions/cache@v4
      if: inputs.cache-write == 'true'
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-
