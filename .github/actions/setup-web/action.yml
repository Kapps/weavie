name: Set up web toolchain
description: Install the repository pnpm and Node versions with the pnpm store cache.
runs:
  using: composite
  steps:
    # Pinned to the v4.3.0 commit: a mutable tag on a third-party action is arbitrary code in
    # every job that uses it.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        package_json_file: src/web/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: src/web/pnpm-lock.yaml
