name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web_checks:
    name: web checks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Install dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: src/web
        run: pnpm run build

      - name: Lint web app (Biome)
        working-directory: src/web
        run: pnpm run lint

      - name: Test web app (Vitest)
        working-directory: src/web
        run: pnpm run test

  dotnet_tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet

      - name: Install Linux native host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-daemon \
            gstreamer1.0-plugins-good \
            libwebkit2gtk-4.1-0 \
            weston

      - name: Test Core
        run: dotnet test tests/Weavie.Core.Tests/Weavie.Core.Tests.csproj -c Debug

      - name: Test Hosting
        run: dotnet test tests/Weavie.Hosting.Tests/Weavie.Hosting.Tests.csproj -c Debug

      - name: Test Linux environment boundary
        run: dotnet test tests/Weavie.Linux.Tests/Weavie.Linux.Tests.csproj -c Debug

      # Runner's build target builds its sibling Headless worker, so restore that worker first.
      - name: Test headless host
        run: dotnet test tests/Weavie.Headless.Tests/Weavie.Headless.Tests.csproj -c Debug

      - name: Test Runner
        run: dotnet test tests/Weavie.Runner.Tests/Weavie.Runner.Tests.csproj -c Debug

      - name: Test remote host
        run: dotnet test tests/Weavie.Remote.Tests/Weavie.Remote.Tests.csproj -c Debug

  native_build:
    name: native build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            project: src/Weavie.Linux/Weavie.Linux.csproj
            restore: src/Weavie.Linux/Weavie.Linux.csproj
          - name: macos
            os: macos-26
            project: src/Weavie.Mac/Weavie.Mac.csproj
            restore: weavie.slnx
          - name: windows
            os: windows-latest
            project: src/Weavie.Win/Weavie.Win.csproj
            restore: src/Weavie.Win/Weavie.Win.csproj
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet

      # net10.0-macos follows Xcode's SDK and workload versions. Select the newest real bundle before
      # restoring the one solution-wide format workspace that can evaluate every platform project.
      - name: Select latest Xcode
        if: matrix.name == 'macos'
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d | sort -V | tail -1)"

      - name: Restore macOS workload
        if: matrix.name == 'macos'
        run: dotnet workload restore weavie.slnx

      - name: Restore
        run: dotnet restore ${{ matrix.restore }}

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Debug --no-restore

      - name: Verify .NET formatting
        if: matrix.name == 'macos'
        run: dotnet format weavie.slnx --verify-no-changes --no-restore

  # Every OS runs the complete Playwright project set. Shards add machines without increasing the
  # per-runner worker count that previously starved full-stack tests on hosted macOS and Windows.
  e2e:
    name: e2e (${{ matrix.platform.name }}, ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ${{ matrix.platform.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-26
          - name: windows
            os: windows-latest
        shard: [1, 2, 3, 4, 5, 6]
        shards: [6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-web

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      # Headless copies dist into its output, so the web build must precede every host build.
      - name: Build web app
        working-directory: src/web
        run: pnpm run build

      - name: Build integration-test stack
        run: |
          dotnet build src/Weavie.Headless/Weavie.Headless.csproj -c Debug
          dotnet build tools/Weavie.FakeClaude/Weavie.FakeClaude.csproj -c Debug
          dotnet build src/Weavie.Runner/Weavie.Runner.csproj -c Debug

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('src/web/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: src/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Chromium (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: src/web
        run: pnpm exec playwright install chromium

      - name: Run Playwright shard
        id: playwright
        working-directory: src/web
        run: pnpm run e2e:ci --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload Playwright blob report
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ matrix.platform.name }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: src/web/blob-report/
          if-no-files-found: error
          retention-days: 1

      - name: Upload e2e failure traces
        if: ${{ steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ matrix.platform.name }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: src/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  e2e_report:
    name: e2e report (${{ matrix.name }})
    if: ${{ !cancelled() }}
    needs: e2e
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [linux, macos, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-${{ matrix.name }}-*
          path: blob-reports
          merge-multiple: true

      - name: Merge shard reports
        working-directory: src/web
        run: pnpm exec playwright merge-reports --config=playwright.merge.config.ts ../../blob-reports

      - name: Upload merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.name }}
          path: src/web/playwright-report/
          if-no-files-found: error
          retention-days: 14

  # Branch protection needs one stable check name while the implementation jobs fan out behind it.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [web_checks, dotnet_tests, native_build, e2e, e2e_report]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          WEB_CHECKS_RESULT: ${{ needs.web_checks.result }}
          DOTNET_TESTS_RESULT: ${{ needs.dotnet_tests.result }}
          NATIVE_BUILD_RESULT: ${{ needs.native_build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_REPORT_RESULT: ${{ needs.e2e_report.result }}
        run: |
          test "$WEB_CHECKS_RESULT" = success
          test "$DOTNET_TESTS_RESULT" = success
          test "$NATIVE_BUILD_RESULT" = success
          test "$E2E_RESULT" = success
          test "$E2E_REPORT_RESULT" = success
