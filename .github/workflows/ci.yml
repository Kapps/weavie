name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  web_checks:
    name: web checks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test rolling release publisher
        run: bash .github/scripts/test-publish-main-latest.sh

      - uses: ./.github/actions/setup-web

      - name: Install dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: src/web
        run: pnpm run build

      - name: Lint web app (Biome)
        working-directory: src/web
        run: pnpm run lint

      - name: Test web app (Vitest)
        working-directory: src/web
        run: pnpm run test

  dotnet_tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet

      # libdrm's headers describe the structs the display-sync library rewrites; libwebkitgtk-6.0-4 pulls
      # in the GTK 4 stack the host renders through.
      - name: Install Linux native host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-daemon \
            gstreamer1.0-plugins-good \
            libdrm-dev \
            libwebkitgtk-6.0-4 \
            pkg-config \
            wayland-utils \
            weston

      - name: Test Core
        run: dotnet test tests/Weavie.Core.Tests/Weavie.Core.Tests.csproj -c Debug

      - name: Test Hosting
        run: dotnet test tests/Weavie.Hosting.Tests/Weavie.Hosting.Tests.csproj -c Debug

      - name: Test Linux environment boundary
        run: dotnet test tests/Weavie.Linux.Tests/Weavie.Linux.Tests.csproj -c Debug

      # Runner's build target builds its sibling Headless worker, so restore that worker first.
      - name: Test headless host
        run: dotnet test tests/Weavie.Headless.Tests/Weavie.Headless.Tests.csproj -c Debug

      - name: Test Runner
        run: dotnet test tests/Weavie.Runner.Tests/Weavie.Runner.Tests.csproj -c Debug

      - name: Test worktree preview launcher
        run: dotnet test tests/Weavie.WorktreeServe.Tests/Weavie.WorktreeServe.Tests.csproj -c Debug

      - name: Test remote host
        run: dotnet test tests/Weavie.Remote.Tests/Weavie.Remote.Tests.csproj -c Debug

  native_build:
    name: native build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            project: src/Weavie.Linux/Weavie.Linux.csproj
            restore: src/Weavie.Linux/Weavie.Linux.csproj
          - name: macos
            os: macos-26
            project: src/Weavie.Mac/Weavie.Mac.csproj
            restore: weavie.slnx
          - name: windows
            os: windows-latest
            project: src/Weavie.Win/Weavie.Win.csproj
            restore: src/Weavie.Win/Weavie.Win.csproj
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet

      # The Linux host compiles its display-sync library against libdrm's headers.
      - name: Install Linux native build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libdrm-dev pkg-config

      # net10.0-macos follows Xcode's SDK and workload versions. Select the newest real bundle before
      # restoring the one solution-wide format workspace that can evaluate every platform project.
      - name: Select latest Xcode
        if: matrix.name == 'macos'
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d | sort -V | tail -1)"

      - name: Restore macOS workload
        if: matrix.name == 'macos'
        run: dotnet workload restore weavie.slnx

      - name: Restore
        run: dotnet restore ${{ matrix.restore }}

      - name: Build
        run: dotnet build ${{ matrix.project }} -c Debug --no-restore

      - name: Test macOS native process isolation
        if: matrix.name == 'macos'
        run: |
          mkdir -p temp/macos-pty
          mac_min=$(dotnet msbuild src/Weavie.Mac/Weavie.Mac.csproj -getProperty:WeavieMacOSMinimumVersion)
          clang -Wall -Wextra -Werror -mmacosx-version-min="$mac_min" -O2 src/Weavie.Mac/native/weavie_pty_launcher.c -o temp/macos-pty/weavie-pty-launcher
          clang -Wall -Wextra -Werror -mmacosx-version-min="$mac_min" -O2 tests/native/macos-pty.c src/Weavie.Mac/native/weavie_pty.c src/Weavie.Mac/native/weavie_spawn.c -o temp/macos-pty/tests
          "$PWD/temp/macos-pty/tests" "$PWD/temp/macos-pty/weavie-pty-launcher"

      - name: Test native macOS PTY lifecycle
        if: matrix.name == 'macos'
        run: dotnet test tests/Weavie.Core.Tests/Weavie.Core.Tests.csproj -c Debug --filter "FullyQualifiedName~PosixPtyTerminalTests|FullyQualifiedName~OwnedProcessTests"

      - name: Test macOS application menu
        if: matrix.name == 'macos'
        run: dotnet run --project tests/Weavie.Mac.Tests/Weavie.Mac.Tests.csproj -c Debug --no-restore

      - name: Test macOS GUI process-tree termination
        if: matrix.name == 'macos'
        run: python3 tests/native/macos-process-tree.py tests/Weavie.Mac.Tests/bin/Debug/net10.0-macos/osx-arm64/Weavie.Mac.Tests.app --control

      - name: Verify .NET formatting
        if: matrix.name == 'macos'
        run: dotnet format weavie.slnx --verify-no-changes --no-restore

  e2e:
    name: e2e (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux
            os: ubuntu-latest
            rid: linux-x64
            suffix: ""
          - name: macos
            os: macos-26
            rid: osx-arm64
            suffix: ""
          - name: windows
            os: windows-latest
            rid: win-x64
            suffix: .exe
    uses: ./.github/workflows/e2e-platform.yml
    with:
      platform: ${{ matrix.platform.name }}
      os: ${{ matrix.platform.os }}
      rid: ${{ matrix.platform.rid }}
      suffix: ${{ matrix.platform.suffix }}

  # Branch protection needs one stable check name while the implementation jobs fan out behind it.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [web_checks, dotnet_tests, native_build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          WEB_CHECKS_RESULT: ${{ needs.web_checks.result }}
          DOTNET_TESTS_RESULT: ${{ needs.dotnet_tests.result }}
          NATIVE_BUILD_RESULT: ${{ needs.native_build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$WEB_CHECKS_RESULT" = success
          test "$DOTNET_TESTS_RESULT" = success
          test "$NATIVE_BUILD_RESULT" = success
          test "$E2E_RESULT" = success
