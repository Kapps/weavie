name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      full:
        required: true
        type: boolean

concurrency:
  group: ci-${{ (inputs.ref || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      native_matrix: ${{ steps.matrix.outputs.native_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - id: matrix
        env:
          FULL: ${{ inputs.full || false }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          platforms = json.loads(Path('.github/platforms.json').read_text())
          matrix = {'platform': [p for p in platforms if os.environ['FULL'] == 'true' or p['name'] == 'linux']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={json.dumps(matrix)}\n')
              output.write(f'native_matrix={json.dumps({"platform": platforms})}\n')
          PYTHON

  web_checks:
    name: web checks
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - &trusted-infrastructure
        name: Check out trusted build infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: temp/workflow
          sparse-checkout: .github
      - name: Authorize and check out release source
        if: inputs.ref
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py

      - uses: ./temp/workflow/.github/actions/setup-web
        with:
          cache-write: ${{ !inputs.ref }}

      - name: Test rolling release publisher
        working-directory: temp/workflow
        run: |
          bash .github/scripts/test-publish-main-latest.sh
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Build web app
        working-directory: src/web
        run: pnpm run build

      - name: Lint web app (Biome)
        working-directory: src/web
        run: pnpm run lint

      - name: Test web app (Vitest)
        working-directory: src/web
        run: pnpm run test

  dotnet_tests:
    name: .NET tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted-infrastructure
      - name: Authorize and check out release source
        if: inputs.ref
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - uses: ./temp/workflow/.github/actions/setup-dotnet
        with:
          cache-write: ${{ !inputs.ref }}

      # libdrm's headers describe the structs the display-sync library rewrites; libwebkitgtk-6.0-4 pulls
      # in the GTK 4 stack the host renders through.
      - name: Install Linux native host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            dbus-daemon \
            gstreamer1.0-plugins-good \
            libdrm-dev \
            libwebkitgtk-6.0-4 \
            pkg-config \
            wayland-utils \
            weston

      - name: Verify .NET formatting
        run: python3 temp/workflow/.github/scripts/format-dotnet.py --verify-no-changes

      - name: Test Core
        run: dotnet test tests/Weavie.Core.Tests/Weavie.Core.Tests.csproj -c Debug

      - name: Test Hosting
        run: dotnet test tests/Weavie.Hosting.Tests/Weavie.Hosting.Tests.csproj -c Debug

      - name: Test Linux environment boundary
        run: dotnet test tests/Weavie.Linux.Tests/Weavie.Linux.Tests.csproj -c Debug

      # Runner's build target builds its sibling Headless worker, so restore that worker first.
      - name: Test headless host
        run: dotnet test tests/Weavie.Headless.Tests/Weavie.Headless.Tests.csproj -c Debug

      - name: Test Runner
        run: dotnet test tests/Weavie.Runner.Tests/Weavie.Runner.Tests.csproj -c Debug

      - name: Test worktree preview launcher
        run: dotnet test tests/Weavie.WorktreeServe.Tests/Weavie.WorktreeServe.Tests.csproj -c Debug

      - name: Test remote host
        run: dotnet test tests/Weavie.Remote.Tests/Weavie.Remote.Tests.csproj -c Debug

  native_build:
    needs: platforms
    name: native build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.native_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted-infrastructure
      - name: Authorize and check out release source
        if: inputs.ref
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - uses: ./temp/workflow/.github/actions/setup-dotnet
        with:
          cache-write: ${{ !inputs.ref }}

      # The Linux host compiles its display-sync library against libdrm's headers.
      - name: Install Linux native build dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libdrm-dev pkg-config dbus-daemon gstreamer1.0-plugins-good libwebkitgtk-6.0-4 xvfb xauth apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      # net10.0-macos follows Xcode's SDK and workload versions. Select the newest real bundle before
      # restoring the one solution-wide format workspace that can evaluate every platform project.
      - name: Select latest Xcode
        if: matrix.platform.name == 'macos'
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d | sort -V | tail -1)"

      - name: Restore macOS workload
        if: matrix.platform.name == 'macos'
        run: dotnet workload restore weavie.slnx

      - uses: ./temp/workflow/.github/actions/setup-web
        with:
          cache-write: ${{ !inputs.ref }}
      - run: corepack pnpm install --frozen-lockfile
        working-directory: src/web

      - name: Restore
        run: dotnet restore ${{ matrix.platform.restore }}

      - name: Build
        run: |
          dotnet build ${{ matrix.platform.project }} -c Release
          dotnet build tools/Weavie.FakeClaude
          dotnet build tools/Weavie.FakeAcp

      - name: Test desktop bridge in the production application
        working-directory: src/web
        shell: bash
        run: |
          prefix=()
          if [[ "${{ matrix.platform.name }}" == linux ]]; then prefix=(dbus-run-session -- xvfb-run -a); fi
          "${prefix[@]}" corepack pnpm exec playwright test -c e2e/desktop/desktop.config.ts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-bridge-${{ matrix.platform.name }}
          path: src/web/test-results

      - name: Test macOS native process isolation
        if: matrix.platform.name == 'macos'
        run: |
          mkdir -p temp/macos-pty
          mac_min=$(dotnet msbuild src/Weavie.Mac/Weavie.Mac.csproj -getProperty:WeavieMacOSMinimumVersion)
          clang -Wall -Wextra -Werror -mmacosx-version-min="$mac_min" -O2 src/Weavie.Mac/native/weavie_pty_launcher.c -o temp/macos-pty/weavie-pty-launcher
          clang -Wall -Wextra -Werror -mmacosx-version-min="$mac_min" -O2 tests/native/macos-pty.c src/Weavie.Mac/native/weavie_pty.c src/Weavie.Mac/native/weavie_spawn.c -o temp/macos-pty/tests
          "$PWD/temp/macos-pty/tests" "$PWD/temp/macos-pty/weavie-pty-launcher"

      - name: Test native macOS PTY lifecycle
        if: matrix.platform.name == 'macos'
        run: dotnet test tests/Weavie.Core.Tests/Weavie.Core.Tests.csproj -c Debug --filter "FullyQualifiedName~PosixPtyTerminalTests|FullyQualifiedName~OwnedProcessTests"

      - name: Test macOS application menu
        if: matrix.platform.name == 'macos'
        run: dotnet run --project tests/Weavie.Mac.Tests/Weavie.Mac.Tests.csproj -c Debug --no-restore

      - name: Test macOS GUI process-tree termination
        if: matrix.platform.name == 'macos'
        run: python3 tests/native/macos-process-tree.py tests/Weavie.Mac.Tests/bin/Debug/net10.0-macos/osx-arm64/Weavie.Mac.Tests.app --control

      - name: Verify .NET formatting
        if: matrix.platform.name == 'macos'
        run: dotnet format weavie.slnx --verify-no-changes --no-restore

  e2e:
    needs: platforms
    name: e2e (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    uses: ./.github/workflows/e2e-platform.yml
    with:
      cache-write: ${{ !inputs.ref }}
      ref: ${{ inputs.ref }}
      platform: ${{ matrix.platform.name }}
      os: ${{ matrix.platform.os }}
      rid: ${{ matrix.platform.rid }}
      suffix: ${{ matrix.platform.suffix }}

  # Branch protection needs one stable check name while the implementation jobs fan out behind it.
  ci:
    name: ci
    if: ${{ always() }}
    needs: [web_checks, dotnet_tests, native_build, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          WEB_CHECKS_RESULT: ${{ needs.web_checks.result }}
          DOTNET_TESTS_RESULT: ${{ needs.dotnet_tests.result }}
          NATIVE_BUILD_RESULT: ${{ needs.native_build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$WEB_CHECKS_RESULT" = success
          test "$DOTNET_TESTS_RESULT" = success
          test "$NATIVE_BUILD_RESULT" = success
          test "$E2E_RESULT" = success
