name: e2e platform

on:
  workflow_call:
    inputs:
      cache-write:
        required: true
        type: boolean
      ref:
        required: true
        type: string
      platform:
        required: true
        type: string
      os:
        required: true
        type: string
      rid:
        required: true
        type: string
      suffix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: bundle
    runs-on: ${{ inputs.os }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      playwright: ${{ steps.plan.outputs.playwright }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - &trusted-infrastructure
        name: Check out trusted build infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: temp/workflow
          sparse-checkout: .github
      - name: Authorize and check out release source
        if: inputs.ref
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - uses: ./temp/workflow/.github/actions/setup-dotnet
        with:
          cache-write: ${{ inputs.cache-write }}
      - uses: ./temp/workflow/.github/actions/setup-web
        with:
          cache-write: ${{ inputs.cache-write }}

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      # Runner publish stages the matching self-contained Headless worker, Vite UI, and hook relay.
      # The generic ACP fake exercises the external agent process seam.
      - name: Publish self-contained test bundle
        shell: bash
        run: |
          dotnet publish src/Weavie.Runner/Weavie.Runner.csproj \
            -c Release -r ${{ inputs.rid }} --self-contained \
            -o artifacts/e2e-bundle/runner
          dotnet publish tools/Weavie.FakeClaude/Weavie.FakeClaude.csproj \
            -c Release -r ${{ inputs.rid }} --self-contained \
            -o artifacts/e2e-bundle/fake-claude
          dotnet publish tools/Weavie.FakeAcp/Weavie.FakeAcp.csproj \
            -c Release -r ${{ inputs.rid }} --self-contained \
            -o artifacts/e2e-bundle/fake-acp

      # The newest green Linux run's per-file times, shared by every platform: relative cost is what
      # balances shards, and only Linux runs on every push.
      - name: Restore e2e timings
        uses: actions/cache/restore@v4
        with:
          path: e2e-timings.json
          key: e2e-timings-${{ github.run_id }}
          restore-keys: e2e-timings-
          enableCrossOsArchive: true

      # Plans once so every shard runs from the same partition of the listed tests.
      - name: Plan e2e shards
        id: plan
        shell: bash
        working-directory: src/web
        env:
          SHARDS: 8
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-list.json
        run: |
          pnpm exec playwright test --list --reporter=json > /dev/null
          python3 ../../temp/workflow/.github/scripts/plan_e2e_shards.py plan \
            "$PLAYWRIGHT_JSON_OUTPUT_FILE" ../../e2e-timings.json "$SHARDS" ../../artifacts/e2e-bundle/shards
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range(1, $SHARDS + 1))))")" >> "$GITHUB_OUTPUT"
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify test bundle
        shell: bash
        run: |
          test -f "artifacts/e2e-bundle/runner/Weavie.Runner${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/runner/worker/Weavie.Headless${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/runner/worker/weavie-hook-relay${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/runner/worker/wwwroot/index.html"
          test -f "artifacts/e2e-bundle/fake-claude/Weavie.FakeClaude${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/fake-acp/weavie-fake-acp${{ inputs.suffix }}"

      - name: Verify macOS PTY assets
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          test -f artifacts/e2e-bundle/runner/worker/libweavie_pty.dylib
          test -x artifacts/e2e-bundle/runner/worker/weavie-pty-launcher

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle-${{ inputs.platform }}
          path: artifacts/e2e-bundle/
          if-no-files-found: error
          retention-days: 1

  # Every platform runs the complete Playwright project set against one immutable build. Shards add
  # machines without increasing the worker count that starved hosted macOS and Windows.
  # Linux runs in Playwright's image, whose browsers and OS dependencies are baked in, so no shard
  # waits on an apt mirror.
  e2e:
    name: shard (${{ matrix.shard }})
    needs: bundle
    runs-on: ${{ inputs.os }}
    container:
      image: ${{ inputs.platform == 'linux' && format('mcr.microsoft.com/playwright:v{0}-noble', needs.bundle.outputs.playwright) || '' }}
      options: --user 1001
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.bundle.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted-infrastructure
      - name: Authorize and check out release source
        if: inputs.ref
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - uses: ./temp/workflow/.github/actions/setup-web
        with:
          cache-write: ${{ inputs.cache-write }}

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Download test bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle-${{ inputs.platform }}
          path: .e2e-bundle

      # upload-artifact does not preserve executable bits. The worker's staged wwwroot is also copied back
      # to the checkout for browser-only specs whose mock host serves src/web/dist directly.
      #
      # Flake, 2026-08-16 21:04 UTC: https://github.com/Kapps/weavie/actions/runs/31972425232/job/95227136515
      # macOS hosted runner returned `fcopyfile failed: Input/output error` from `cp -R` on a transient
      # disk hiccup — no code or test defect. Retrying the copy on failure.
      - name: Prepare test bundle
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != Windows ]]; then
            chmod +x \
              .e2e-bundle/runner/Weavie.Runner \
              .e2e-bundle/runner/worker/Weavie.Headless \
              .e2e-bundle/runner/worker/weavie-hook-relay \
              .e2e-bundle/fake-claude/Weavie.FakeClaude \
              .e2e-bundle/fake-acp/weavie-fake-acp
          fi
          if [[ "${{ runner.os }}" == macOS ]]; then
            chmod +x .e2e-bundle/runner/worker/weavie-pty-launcher
          fi
          echo "WEAVIE_E2E_BUNDLE=$GITHUB_WORKSPACE/.e2e-bundle" >> "$GITHUB_ENV"
          if [[ "${{ runner.os }}" != Linux ]]; then
            echo "PLAYWRIGHT_BROWSERS_PATH=$GITHUB_WORKSPACE/.pw-browsers" >> "$GITHUB_ENV"
          fi
          mkdir -p src/web/dist
          for attempt in 1 2 3; do
            if cp -R .e2e-bundle/runner/worker/wwwroot/. src/web/dist/; then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "cp failed after $attempt attempts" >&2
              exit 1
            fi
            echo "cp failed (attempt $attempt), retrying..." >&2
            sleep 2
          done

      - name: Cache Playwright browsers
        if: inputs.cache-write && runner.os != 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('src/web/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: src/web
        run: pnpm exec playwright install chromium

      - name: Run Playwright shard
        id: playwright
        working-directory: src/web
        shell: bash
        run: pnpm run e2e:ci --test-list "$WEAVIE_E2E_BUNDLE/shards/${{ matrix.shard }}.txt"

      - name: Upload Playwright blob report
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ inputs.platform }}-${{ matrix.shard }}
          path: src/web/blob-report/
          if-no-files-found: error
          retention-days: 1

      # Bug, 2026-08-19 ~21:17 UTC: https://github.com/Kapps/weavie/actions/runs/32302259233/job/96228596384
      # This `if` had no status-check function, so GitHub Actions implicitly ANDs it with `success()` —
      # which is always false once the prior step has already failed, so the condition never fires and
      # failure diagnostics (viewport-layout.json, console-errors.txt, weavie-host.log) never get
      # uploaded. Matches the working `!cancelled()` guard already used on the blob-report upload above.
      - name: Upload e2e failure traces
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ inputs.platform }}-${{ matrix.shard }}
          path: src/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: report
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - *trusted-infrastructure
      - name: Authorize and check out release source
        if: inputs.ref
        env:
          SOURCE_COMMIT: ${{ inputs.ref }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - uses: ./temp/workflow/.github/actions/setup-web
        with:
          cache-write: ${{ inputs.cache-write }}

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-${{ inputs.platform }}-*
          path: blob-reports
          merge-multiple: true

      - name: Merge shard reports
        working-directory: src/web
        run: pnpm exec playwright merge-reports --config=playwright.merge.config.ts ../../blob-reports

      - name: Record e2e timings
        if: inputs.platform == 'linux' && inputs.cache-write && needs.e2e.result == 'success'
        working-directory: src/web
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/e2e-report.json
        run: |
          pnpm exec playwright merge-reports --config=playwright.merge.config.ts --reporter=json ../../blob-reports > /dev/null
          python3 ../../temp/workflow/.github/scripts/plan_e2e_shards.py timings "$PLAYWRIGHT_JSON_OUTPUT_FILE" ../../e2e-timings.json

      - name: Save e2e timings
        if: inputs.platform == 'linux' && inputs.cache-write && needs.e2e.result == 'success'
        uses: actions/cache/save@v4
        with:
          path: e2e-timings.json
          key: e2e-timings-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

      - name: Upload merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ inputs.platform }}
          path: src/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
