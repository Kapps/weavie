name: e2e platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      os:
        required: true
        type: string
      rid:
        required: true
        type: string
      suffix:
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    name: bundle
    runs-on: ${{ inputs.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - uses: ./.github/actions/setup-web

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      # Runner publish stages the matching self-contained Headless worker, Vite UI, and hook relay.
      # The generic ACP fake exercises the external agent process seam.
      - name: Publish self-contained test bundle
        shell: bash
        run: |
          dotnet publish src/Weavie.Runner/Weavie.Runner.csproj \
            -c Release -r ${{ inputs.rid }} --self-contained \
            -o artifacts/e2e-bundle/runner
          dotnet publish tools/Weavie.FakeClaude/Weavie.FakeClaude.csproj \
            -c Release -r ${{ inputs.rid }} --self-contained \
            -o artifacts/e2e-bundle/fake-claude
          dotnet publish tools/Weavie.FakeAcp/Weavie.FakeAcp.csproj \
            -c Release -r ${{ inputs.rid }} --self-contained \
            -o artifacts/e2e-bundle/fake-acp

      - name: Verify test bundle
        shell: bash
        run: |
          test -f "artifacts/e2e-bundle/runner/Weavie.Runner${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/runner/worker/Weavie.Headless${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/runner/worker/weavie-hook-relay${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/runner/worker/wwwroot/index.html"
          test -f "artifacts/e2e-bundle/fake-claude/Weavie.FakeClaude${{ inputs.suffix }}"
          test -f "artifacts/e2e-bundle/fake-acp/weavie-fake-acp${{ inputs.suffix }}"

      - name: Upload test bundle
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bundle-${{ inputs.platform }}
          path: artifacts/e2e-bundle/
          if-no-files-found: error
          retention-days: 1

  # Every platform runs the complete Playwright project set against one immutable build. Shards add
  # machines without increasing the worker count that starved hosted macOS and Windows.
  e2e:
    name: shard (${{ matrix.shard }}/${{ matrix.shards }})
    needs: bundle
    runs-on: ${{ inputs.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
      WEAVIE_E2E_BUNDLE: ${{ github.workspace }}/.e2e-bundle
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        shards: [3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Download test bundle
        uses: actions/download-artifact@v4
        with:
          name: e2e-bundle-${{ inputs.platform }}
          path: .e2e-bundle

      # upload-artifact does not preserve executable bits. The worker's staged wwwroot is also copied back
      # to the checkout for browser-only specs whose mock host serves src/web/dist directly.
      #
      # Flake, 2026-08-16 21:04 UTC: https://github.com/Kapps/weavie/actions/runs/31972425232/job/95227136515
      # macOS hosted runner returned `fcopyfile failed: Input/output error` from `cp -R` on a transient
      # disk hiccup — no code or test defect. Retrying the copy on failure.
      - name: Prepare test bundle
        shell: bash
        run: |
          if [[ "${{ runner.os }}" != Windows ]]; then
            chmod +x \
              .e2e-bundle/runner/Weavie.Runner \
              .e2e-bundle/runner/worker/Weavie.Headless \
              .e2e-bundle/runner/worker/weavie-hook-relay \
              .e2e-bundle/fake-claude/Weavie.FakeClaude \
              .e2e-bundle/fake-acp/weavie-fake-acp
          fi
          mkdir -p src/web/dist
          for attempt in 1 2 3; do
            if cp -R .e2e-bundle/runner/worker/wwwroot/. src/web/dist/; then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "cp failed after $attempt attempts" >&2
              exit 1
            fi
            echo "cp failed (attempt $attempt), retrying..." >&2
            sleep 2
          done

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.pw-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('src/web/pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      # Hang, 2026-08-19 ~19:52 UTC: https://github.com/Kapps/weavie/actions/runs/32295180447 —
      # 5/6 Linux shards stuck here for over an hour. `--with-deps` shells out to `sudo apt-get`,
      # which can stall indefinitely on a flaky archive mirror on hosted Ubuntu runners (known
      # upstream: actions/runner-images#11347, microsoft/playwright#20665/#41133) — not caused by
      # this repo's code.
      #
      # Follow-up, 2026-08-19 ~21:05 UTC: https://github.com/Kapps/weavie/actions/runs/32301304438/job/96224774374
      # First bounded-retry attempt (`timeout 5m`, no cleanup) correctly killed the stuck attempt,
      # but `timeout` only signals the `pnpm exec` process it launched directly — the `sudo
      # apt-get` grandchild it spawns survives as an orphan holding the dpkg lock, so every retry
      # after the first failed instantly with "Could not get lock /var/lib/dpkg/lock-frontend".
      # Clearing that lock (and any surviving apt-get/dpkg process) before each retry lets the
      # retry actually retry.
      #
      # Follow-up, 2026-08-19 ~21:48 UTC: https://github.com/Kapps/weavie/actions/runs/32303798223/job/96234015439
      # With the lock cleared, all 3 attempts genuinely retried apt-get from scratch — but all 3 still
      # hit the 5m timeout. Root cause this time wasn't a true hang: `azure.archive.ubuntu.com` (the
      # runner's default mirror) failed outright each attempt (`Ign:` lines), apt fell back to
      # `archive.ubuntu.com` after ~2m of retries against the dead mirror, leaving too little of the
      # 5m budget for the actual package fetch (already slow: ~56 kB/s observed in the prior run).
      # Widened to 10m so a genuinely-progressing-but-slow attempt (mirror fallback + a throttled
      # fetch) fits inside one attempt instead of being killed and retried for no reason.
      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        working-directory: src/web
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if timeout 10m pnpm exec playwright install --with-deps chromium; then
              break
            fi
            if [[ $attempt == 3 ]]; then
              echo "playwright install --with-deps timed out after $attempt attempts" >&2
              exit 1
            fi
            echo "playwright install --with-deps timed out (attempt $attempt); clearing the apt lock left behind by the timeout and retrying..." >&2
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a || true
          done

      - name: Install Playwright Chromium (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: src/web
        run: pnpm exec playwright install chromium

      - name: Run Playwright shard
        id: playwright
        working-directory: src/web
        run: pnpm run e2e:ci --shard=${{ matrix.shard }}/${{ matrix.shards }}

      - name: Upload Playwright blob report
        if: ${{ !cancelled() && steps.playwright.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-blob-${{ inputs.platform }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: src/web/blob-report/
          if-no-files-found: error
          retention-days: 1

      # Bug, 2026-08-19 ~21:17 UTC: https://github.com/Kapps/weavie/actions/runs/32302259233/job/96228596384
      # This `if` had no status-check function, so GitHub Actions implicitly ANDs it with `success()` —
      # which is always false once the prior step has already failed, so the condition never fires and
      # failure diagnostics (viewport-layout.json, console-errors.txt, weavie-host.log) never get
      # uploaded. Matches the working `!cancelled()` guard already used on the blob-report upload above.
      - name: Upload e2e failure traces
        if: ${{ !cancelled() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces-${{ inputs.platform }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: src/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: report
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-web

      - name: Install web dependencies
        working-directory: src/web
        run: pnpm install --frozen-lockfile

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-blob-${{ inputs.platform }}-*
          path: blob-reports
          merge-multiple: true

      - name: Merge shard reports
        working-directory: src/web
        run: pnpm exec playwright merge-reports --config=playwright.merge.config.ts ../../blob-reports

      - name: Upload merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ inputs.platform }}
          path: src/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
