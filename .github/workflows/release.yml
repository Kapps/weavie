name: release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release {0} ({1}) from {2}', inputs.channel, inputs.bump, inputs.source || 'main-latest') || 'Build latest from green main' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: stable
        options: [stable, latest]
      bump:
        description: Public version bump (stable only)
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]
      source:
        description: Published build number or full commit SHA (blank uses main-latest)
        required: false
        type: string
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

# Both channels share this workflow's build sequence; stable version allocation is serialized.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'latest' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      build: ${{ steps.plan.outputs.build }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Pin source and release version
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: python3 .github/scripts/release_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error

  checks:
    needs: prepare
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      full: ${{ needs.prepare.outputs.channel == 'stable' }}

  runner:
    name: runner bundle
    needs: prepare
    runs-on: ubuntu-latest
    env:
      PublicVersion: ${{ needs.prepare.outputs.version }}
      BuildNumber: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - &trusted-infrastructure
        name: Check out trusted build infrastructure
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: temp/workflow
          sparse-checkout: .github
      - name: Authorize and check out release source
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - uses: ./temp/workflow/.github/actions/publish-setup
      - name: Publish runner and worker
        run: >-
          dotnet publish src/Weavie.Runner/Weavie.Runner.csproj -c Release -r linux-x64
          --self-contained -p:PublishReadyToRun=true -o layout/versions/$BuildNumber
      - name: Package managed layout
        run: |
          ln -s "versions/$BuildNumber" layout/current
          tar -C layout -czf weavie-runner-linux-x64.tar.gz versions current
      - uses: actions/upload-artifact@v4
        with:
          name: weavie-runner-linux-x64
          path: weavie-runner-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: package (${{ matrix.platform.name }})
    needs: prepare
    runs-on: ${{ matrix.platform.os }}
    env:
      PublicVersion: ${{ needs.prepare.outputs.version }}
      BuildNumber: ${{ needs.prepare.outputs.build }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - *trusted-infrastructure
      - name: Authorize and check out release source
        env:
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: python3 temp/workflow/.github/scripts/checkout_release_source.py
      - name: Set up toolchain and build web app
        uses: ./temp/workflow/.github/actions/publish-setup

      # The Linux host compiles its display-sync library against libdrm's headers.
      - name: Install Linux native build dependencies
        if: matrix.platform.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libdrm-dev pkg-config

      # The hosted image's default Xcode lags the .NET macOS workload's requirement (e.g. workload
      # 26.5.10301 needs Xcode 26.6, but the image defaults to 26.5). Both ship side-by-side on the
      # runner, so select the newest installed one rather than a version pinned here that would
      # itself go stale the next time the workload's requirement moves. See ci.yml.
      - name: Select latest Xcode
        if: matrix.platform.name == 'macos'
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d | sort -V | tail -1)"

      - name: Restore macOS workload
        if: matrix.platform.name == 'macos'
        run: dotnet workload restore ${{ matrix.platform.project }}

      - name: Publish
        run: >
          dotnet publish ${{ matrix.platform.project }} -c Release -r ${{ matrix.platform.rid }}
          ${{ matrix.platform.extra }} -o artifacts/${{ matrix.platform.name }}

      # The COMPLETE macOS bundle is the .app the build assembles at bin/ (populated by CopyWebAssets +
      # BuildPtyShim + the hook-relay co-location), NOT the .pkg `dotnet publish` emits — that .pkg
      # lacks the hand-copied web UI / PTY shim / hook relay and boots to a blank WKWebView. Verify
      # that .app, re-sign it (the post-build copies invalidate the SDK's mid-build ad-hoc signature,
      # and on Apple Silicon an invalid signature reads as "damaged and can't be opened"), and zip it
      # (a drag-to-Applications bundle — friendlier for an unsigned app than an unsigned .pkg). It's
      # still not Developer-ID-signed/notarized, so first launch is right-click > Open (or
      # `xattr -dr com.apple.quarantine Weavie.app`).
      - name: Package macOS app
        if: matrix.platform.name == 'macos'
        shell: bash
        run: |
          app="src/Weavie.Mac/bin/Release/net10.0-macos/${{ matrix.platform.rid }}/Weavie.app"
          required=(
            "$app/Contents/MacOS/Weavie"
            "$app/Contents/Resources/wwwroot/index.html"
            "$app/Contents/MonoBundle/libweavie_pty.dylib"
            "$app/Contents/MonoBundle/weavie-pty-launcher"
            "$app/Contents/MonoBundle/weavie-hook-relay"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ -e "$f" ]; then echo "ok: $f"; else echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Built Weavie.app is incomplete — see MISSING entries above."
            echo "Bundle contents:"; find "$app" -maxdepth 3 -print
            exit 1
          fi
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.platform.asset }}"

      # tar (not zip) so the self-contained executable's +x bit survives download+extract on Linux.
      - name: Package Linux archive
        if: matrix.platform.name == 'linux'
        run: tar -C artifacts/${{ matrix.platform.name }} -czf "${{ matrix.platform.asset }}" .

      - name: Package Windows archive
        if: matrix.platform.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.platform.name }}/* -DestinationPath "${{ matrix.platform.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weavie-${{ matrix.platform.name }}
          path: ${{ matrix.platform.asset }}
          if-no-files-found: error

  release:
    name: publish release and advance channel
    needs: [prepare, checks, runner, publish]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.runner.result == 'success' && needs.publish.result == 'success' &&
      (needs.checks.result == 'success' ||
       (github.event_name == 'workflow_run' && needs.checks.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      # Privileged publication executes the workflow revision, never the selected build's scripts.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: weavie-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-assets
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish_release.py
