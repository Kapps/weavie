# Release: publish each native shell as a self-contained, startup-optimized build.
#
# Startup optimization = ReadyToRun (PublishReadyToRun): IL is precompiled to native so there's
# little JIT work at launch. Native AOT is NOT usable here — WinForms (and WPF, which Weavie.Win
# enables for the WebView2 control) and WebView2 rely on reflection/COM that AOT doesn't support —
# so R2R + self-contained is the right lever. The publish output is a plain folder (no single-file
# compression, which would decompress at launch and hurt cold start), packaged into one downloadable
# archive per shell.
#
# Each shell publishes on its own OS (Weavie.Win needs Windows; Weavie.Mac needs the macOS workload).
# On a v* tag or manual dispatch the archive is uploaded as a build artifact. On green main
# (workflow_run) the runner and shell archives are published together to the rolling `main-latest`
# prerelease consumed by `weavie-runner --auto-update`. See docs/specs/runner-auto-update.md.
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

# Serialize each complete rolling release; the pending slot coalesces newer green runs.
# Tag and manual releases use unique run IDs.
concurrency:
  group: >-
    release-${{
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      'main-latest' || github.run_id
    }}
  cancel-in-progress: false

jobs:
  runner:
    name: runner bundle
    # Only a PUSH-triggered ci success qualifies: workflow_run also fires for fork-PR ci runs, and a
    # fork branch named "main" must never reach a contents:write job (it could rewrite the release
    # feed the auto-updater trusts). Push events can only originate from this repo.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      # Build the exact trusted push commit that passed CI, never a newer unvalidated main tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up toolchain and build web app
        uses: ./.github/actions/publish-setup

      # The remote control plane. Its publish stages the Weavie.Headless worker into worker/,
      # propagating RID + self-contained, so this single bundle is the full runner + headless deploy.
      - name: Publish runner bundle into the managed layout
        run: >
          dotnet publish src/Weavie.Runner/Weavie.Runner.csproj -c Release -r linux-x64
          --self-contained -p:PublishReadyToRun=true
          -o layout/versions/${{ github.run_number }}

      # A tarball (not upload-artifact's zip) so executable bits and the current symlink survive.
      - name: Package layout tarball
        run: |
          ln -s versions/${{ github.run_number }} layout/current
          tar -C layout -czf weavie-runner-linux-x64.tar.gz versions current

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weavie-runner-linux-x64
          path: weavie-runner-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    name: publish (${{ matrix.name }})
    # Tag/dispatch always; on workflow_run only for a green main PUSH (never a fork-PR ci run).
    if: >-
      github.event_name != 'workflow_run' ||
        ( github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            project: src/Weavie.Linux/Weavie.Linux.csproj
            rid: linux-x64
            # R2R + self-contained: native-precompiled, no machine .NET dependency.
            extra: --self-contained -p:PublishReadyToRun=true
            asset: weavie-linux-x64.tar.gz
          - name: win-x64
            os: windows-latest
            project: src/Weavie.Win/Weavie.Win.csproj
            rid: win-x64
            extra: --self-contained -p:PublishReadyToRun=true
            asset: weavie-win-x64.zip
          - name: osx-arm64
            # macOS 26 (Tahoe) image — ships Xcode 26, which net10.0-macos requires. See ci.yml.
            os: macos-26
            project: src/Weavie.Mac/Weavie.Mac.csproj
            rid: osx-arm64
            # net10.0-macos publishes a self-contained .app via the macos workload. Trimming is
            # disabled in the csproj (PublishTrimmed=false): Weavie.Core's reflection-based
            # System.Text.Json isn't trim-safe. R2R isn't the lever here, so it's left to the
            # workload's Release defaults.
            extra: ""
            asset: weavie-osx-arm64.zip
    steps:
      # Green-main releases build the exact trusted push commit that passed CI. Tag and manual
      # releases check out their own ref.
      - uses: actions/checkout@v4
        with:
          ref: >-
            ${{ github.event_name == 'workflow_run' &&
                github.event.workflow_run.head_sha || github.ref }}

      - name: Set up toolchain and build web app
        uses: ./.github/actions/publish-setup

      # The hosted image's default Xcode lags the .NET macOS workload's requirement (e.g. workload
      # 26.5.10301 needs Xcode 26.6, but the image defaults to 26.5). Both ship side-by-side on the
      # runner, so select the newest installed one rather than a version pinned here that would
      # itself go stale the next time the workload's requirement moves. See ci.yml.
      - name: Select latest Xcode
        if: matrix.name == 'osx-arm64'
        run: sudo xcode-select -s "$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d | sort -V | tail -1)"

      - name: Restore macOS workload
        if: matrix.name == 'osx-arm64'
        run: dotnet workload restore ${{ matrix.project }}

      - name: Publish
        run: >
          dotnet publish ${{ matrix.project }} -c Release -r ${{ matrix.rid }}
          ${{ matrix.extra }} -o artifacts/${{ matrix.name }}

      # The COMPLETE macOS bundle is the .app the build assembles at bin/ (populated by CopyWebAssets +
      # BuildPtyShim + the hook-relay co-location), NOT the .pkg `dotnet publish` emits — that .pkg
      # lacks the hand-copied web UI / PTY shim / hook relay and boots to a blank WKWebView. Verify
      # that .app, re-sign it (the post-build copies invalidate the SDK's mid-build ad-hoc signature,
      # and on Apple Silicon an invalid signature reads as "damaged and can't be opened"), and zip it
      # (a drag-to-Applications bundle — friendlier for an unsigned app than an unsigned .pkg). It's
      # still not Developer-ID-signed/notarized, so first launch is right-click > Open (or
      # `xattr -dr com.apple.quarantine Weavie.app`).
      - name: Package macOS app
        if: matrix.name == 'osx-arm64'
        shell: bash
        run: |
          app="src/Weavie.Mac/bin/Release/net10.0-macos/${{ matrix.rid }}/Weavie.app"
          required=(
            "$app/Contents/MacOS/Weavie"
            "$app/Contents/Resources/wwwroot/index.html"
            "$app/Contents/MonoBundle/libweavie_pty.dylib"
            "$app/Contents/MonoBundle/weavie-hook-relay"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ -e "$f" ]; then echo "ok: $f"; else echo "MISSING: $f"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Built Weavie.app is incomplete — see MISSING entries above."
            echo "Bundle contents:"; find "$app" -maxdepth 3 -print
            exit 1
          fi
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "${{ matrix.asset }}"

      # tar (not zip) so the self-contained executable's +x bit survives download+extract on Linux.
      - name: Package Linux archive
        if: matrix.name == 'linux-x64'
        run: tar -C artifacts/${{ matrix.name }} -czf "${{ matrix.asset }}" .

      - name: Package Windows archive
        if: matrix.name == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path artifacts/${{ matrix.name }}/* -DestinationPath "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weavie-${{ matrix.name }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  main_latest:
    name: main-latest prerelease
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    needs: [runner, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download complete release
        uses: actions/download-artifact@v4
        with:
          pattern: weavie-*
          path: release-assets
          merge-multiple: true

      # Keep an incomplete replacement private if release creation or asset upload fails.
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          built=${{ github.event.workflow_run.head_sha }}
          staging="main-latest-${{ github.run_id }}-${{ github.run_attempt }}"
          response=$(mktemp)
          api=${{ github.api_url }}/repos/${{ github.repository }}
          api_status() {
            curl --silent --show-error --output "$response" --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$1"
          }
          cleanup_staging() {
            local cleanup_status=0
            local release_id
            local status

            if ! status=$(api_status "$api/releases/tags/$staging"); then
              echo "::error::Staging release lookup failed"
              return 1
            fi
            case "$status" in
              200)
                if ! release_id=$(jq -er .id "$response"); then
                  echo "::error::Staging release response has no ID"
                  cleanup_status=1
                elif ! gh api --method DELETE \
                  "repos/${{ github.repository }}/releases/$release_id"; then
                  cleanup_status=1
                fi
                ;;
              404) ;;
              *) cat "$response"; echo "::error::Staging release lookup returned HTTP $status"; cleanup_status=1 ;;
            esac

            if ! status=$(api_status "$api/git/ref/tags/$staging"); then
              echo "::error::Staging tag lookup failed"
              return 1
            fi
            case "$status" in
              200)
                gh api --method DELETE \
                  "repos/${{ github.repository }}/git/refs/tags/$staging" || cleanup_status=1
                ;;
              404) ;;
              *) cat "$response"; echo "::error::Staging tag lookup returned HTTP $status"; cleanup_status=1 ;;
            esac
            return "$cleanup_status"
          }
          finish() {
            local original_status="$1"
            trap - EXIT
            if ! cleanup_staging; then
              echo "::error::Failed to clean staging release $staging"
              if [ "$original_status" -eq 0 ]; then
                original_status=1
              fi
            fi
            rm -f "$response"
            exit "$original_status"
          }
          if ! cleanup_staging; then
            rm -f "$response"
            exit 1
          fi
          trap 'finish $?' EXIT

          gh release create "$staging" --draft --prerelease \
            --target "$built" \
            --title "main latest (build ${{ github.run_number }})" \
            --notes "Rolling prerelease of green main ($built), build ${{ github.run_number }}. weavie-runner-linux-x64.tar.gz is the runner+worker bundle consumed by weavie-runner --auto-update (extract into ~/.weavie/runner and launch current/Weavie.Runner); the weavie-{linux,win,osx}-* archives are downloadable app binaries. See docs/specs/runner-auto-update.md." \
            release-assets/weavie-runner-linux-x64.tar.gz \
            release-assets/weavie-linux-x64.tar.gz \
            release-assets/weavie-win-x64.zip \
            release-assets/weavie-osx-arm64.zip

          main=$(gh api "repos/${{ github.repository }}/git/ref/heads/main" --jq .object.sha)
          main_relation=$(gh api \
            "repos/${{ github.repository }}/compare/$built...$main" --jq .status)
          case "$main_relation" in
            ahead|identical) ;;
            behind|diverged)
              echo "::notice::Skipping $built because it is no longer on main"
              exit 0
              ;;
            *)
              echo "::error::Unexpected relation to main: $main_relation"
              exit 1
              ;;
          esac

          status=$(api_status "$api/git/ref/tags/main-latest")
          case "$status" in
            200)
              current=$(jq -er .object.sha "$response")
              published_relation=$(gh api \
                "repos/${{ github.repository }}/compare/$current...$main" --jq .status)
              case "$published_relation" in
                behind|diverged)
                  echo "::notice::Replacing $current because it is no longer on main"
                  ;;
                ahead|identical)
                  relation=$(gh api \
                    "repos/${{ github.repository }}/compare/$current...$built" --jq .status)
                  case "$relation" in
                    ahead) ;;
                    identical)
                      echo "::notice::main-latest already points to $built"
                      exit 0
                      ;;
                    behind)
                      echo "::notice::Skipping stale $built; main-latest is already $current"
                      exit 0
                      ;;
                    *)
                      echo "::error::Unexpected commit relation: $relation"
                      exit 1
                      ;;
                  esac
                  ;;
                *)
                  echo "::error::Unexpected published commit relation: $published_relation"
                  exit 1
                  ;;
              esac
              ;;
            404) ;;
            *) cat "$response"; echo "::error::Tag lookup failed with HTTP $status"; exit 1 ;;
          esac

          status=$(api_status "$api/releases/tags/main-latest")
          case "$status" in
            200)
              release_id=$(jq -er .id "$response")
              gh api --method DELETE "repos/${{ github.repository }}/releases/$release_id"
              ;;
            404) ;;
            *) cat "$response"; echo "::error::Release lookup failed with HTTP $status"; exit 1 ;;
          esac

          status=$(api_status "$api/git/ref/tags/main-latest")
          case "$status" in
            200) gh api --method DELETE "repos/${{ github.repository }}/git/refs/tags/main-latest" ;;
            404) ;;
            *) cat "$response"; echo "::error::Tag lookup failed with HTTP $status"; exit 1 ;;
          esac
          status=$(api_status "$api/git/ref/tags/main-latest")
          if [ "$status" != 404 ]; then
            cat "$response"
            echo "::error::main-latest tag cleanup returned HTTP $status"
            exit 1
          fi

          gh release edit "$staging" --tag main-latest --draft=false
          target=$(gh api "repos/${{ github.repository }}/git/ref/tags/main-latest" --jq .object.sha)
          if [ "$target" != "$built" ]; then
            echo "::error::main-latest points to $target instead of $built"
            exit 1
          fi
