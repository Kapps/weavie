id: quick-fix
description: A small, well-understood change. Implement it, verify it, and open a draft PR.
stages:
  - id: implement
    run:
      prompt: >
        Implement the task below. Run the relevant tests and the linter, fix what fails, and commit. Call
        completeStage only once both are green and the work is committed.

        {{run.prompt}}

  - id: pr
    run:
      prompt: Push the branch and open a draft pull request describing the change.
      outputs:
        pr: pr
