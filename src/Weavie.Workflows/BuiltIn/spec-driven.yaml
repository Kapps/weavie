id: spec-driven
description: Requirements, design, and a task list, each approved by you, then each task implemented in turn on this branch.
stages:
  - id: requirements
    run:
      prompt: >
        Interview me as needed about the feature described below, then choose a short kebab-case slug for
        it and write EARS-style user stories with acceptance criteria to docs/specs/<slug>/requirements.md.
        Report the directory you wrote to as the dir output.

        {{run.prompt}}
    role: planner
    outputs:
      dir: text
    then:
      ask: Approve the requirements in {{requirements.dir}}/requirements.md?
      by: user
      choices:
        approve: design
        revise: requirements

  - id: design
    run:
      prompt: Write {{requirements.dir}}/design.md from the approved requirements.
    role: planner
    then:
      ask: Approve the design in {{requirements.dir}}/design.md?
      by: user
      choices:
        approve: tasks
        revise: design

  - id: tasks
    run:
      prompt: >
        Break the approved design into small, independently testable tasks, written as a checklist in
        {{requirements.dir}}/tasks.md. Report them in order as the tasks output.
    role: planner
    outputs:
      tasks: list
    then:
      ask: Approve the task list in {{requirements.dir}}/tasks.md?
      by: user
      choices:
        approve: implement
        revise: tasks

  - id: implement
    foreach: "{{tasks.tasks}}"
    role: builder
    run:
      prompt: >
        Implement task {{implement.index}} of {{requirements.dir}}/tasks.md, following
        {{requirements.dir}}/design.md:

        {{implement.item}}

        Run the tests and the linter, fix what fails, commit, and tick the task off in tasks.md.
