<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Weavie" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/weavie.png" />
    <link rel="icon" type="image/png" href="/weavie.png" />
    <title>weavie</title>
    <!-- Painted before any JS loads: a dark canvas + centered wordmark so the WebView's first frame is
         intentional, not a white flash. The splash stays on top of the whole app and is removed by
         dismissSplash() in one step on the first painted terminal frame (the primary surface; the editor
         pane fills in under it when Monaco loads) — or on editor-ready as a fallback. One clean reveal
         instead of a relay of placeholders, and no fade (a fade is pure startup latency). Inline (no
         external CSS) so it costs zero requests and paints immediately. -->
    <style>
      html, body { height: 100%; margin: 0; background: #000000; color: #cdd5dc; }
      #root { height: 100%; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        font: 600 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.08em; color: #54c6a4; background: #000000;
      }
    </style>
    <!-- Boot error capture. A CLASSIC inline script, run outside the ES-module graph: if a module fails
         to load or link (e.g. a bad import), main.tsx — and the error handlers it would install — never
         runs, so without this a boot failure is invisible (splash hangs forever, no log). This forwards
         uncaught errors to the host log until main.tsx installs the runtime handlers.

         A failed fetch of the entry module or one of its static-import dependencies (transient network
         blip; a browser fires `error` on the `<script type=module>` element itself when its graph fails
         to load) leaves the splash up forever with nothing — the host-log forward above is a no-op
         outside a native WebView, so a plain browser tab gets no recovery at all. Self-heal with one
         bounded reload instead: a repeat failure (bad deploy, not a blip) still gives up rather than
         reload-looping. 2026-08-16 07:16 UTC, run https://github.com/Kapps/weavie/actions/runs/31933442738/job/95132055144
         — Windows e2e shard 1/6 timed out waiting for connection.hello because `preload-helper-*.js`
         failed with net::ERR_NO_BUFFER_SPACE (confirmed root cause #4 in docs/specs/e2e-flake-analysis.md
         — hosted-Windows-runner socket exhaustion; the 2026-07-31 fix there reduced the eager-preload
         footprint but the OS-level exhaustion can still hit any boot request, just less often). This
         reload is the actual fix for that class, in production and in this test alike.

         2026-08-21 03:17 UTC, run https://github.com/Kapps/weavie/actions/runs/32442542060/job/96656628608
         — recurred once more (Windows e2e shard 1/6, chromium project, agent-composer.spec.ts:1048), same
         ERR_NO_BUFFER_SPACE signature but on `page.goto` itself (the entry page fetch, not a module-graph
         dependency) — a case this reload doesn't cover, since the module graph never starts loading if the
         document fetch itself fails. This PR was rebased onto main and landed because of that recurrence;
         see docs/specs/e2e-flake-analysis.md for the still-open entry-page-fetch case. -->
    <script>
      (() => {
        var RETRY_KEY = "weavie-boot-module-retry";
        function toHost(level, message) {
          try {
            const h = window.webkit?.messageHandlers?.weavie || window.chrome?.webview;
            if (h) {
              h.postMessage(JSON.stringify({
                scope: "host", session: null, kind: "event", requestId: null,
                feature: "diagnostics", name: "log", payload: { level, message }, error: null,
              }));
            }
          } catch (_err) {}
        }
        function retryBootModule() {
          try {
            if (sessionStorage.getItem(RETRY_KEY) === "1") {
              toHost("error", "boot module failed to load twice; giving up");
              return;
            }
            sessionStorage.setItem(RETRY_KEY, "1");
          } catch (_err) {
            return;
          }
          toHost("warn", "boot module failed to load; reloading once");
          location.reload();
        }
        function onError(e) {
          var t = e.target;
          if (t && t !== window && t.tagName) {
            toHost("warn", `resource failed to load: ${t.src || t.href || t.tagName}`);
            if (t.tagName === "SCRIPT" && t.type === "module") {
              retryBootModule();
            }
          } else {
            const at = e.filename ? ` @ ${e.filename}:${e.lineno}:${e.colno}` : "";
            toHost("error", `uncaught: ${e.message || "unknown error"}${at}`);
          }
        }
        function onRejection(e) {
          var r = e.reason;
          toHost("error", `unhandledrejection: ${String((r?.message) || r)}`);
        }
        window.addEventListener("error", onError, true);
        window.addEventListener("unhandledrejection", onRejection);
        window.__WEAVIE_CLEAR_BOOT_ERROR_CAPTURE__ = () => {
          window.removeEventListener("error", onError, true);
          window.removeEventListener("unhandledrejection", onRejection);
          try {
            sessionStorage.removeItem(RETRY_KEY);
          } catch (_err) {}
          delete window.__WEAVIE_CLEAR_BOOT_ERROR_CAPTURE__;
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <img src="/weavie.png" width="144" height="144" alt="" />
      <span>weavie</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
